name: Build

on:
  push:
    branches: [ master, main, 'merge-*', 'libxposed-*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.31.6"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch native dependencies
        # Not `submodules: recursive` on the checkout: LSPlant declares two test-only
        # submodules over git@github.com:, which a blanket recursive fetch tries (and fails)
        # to clone over SSH. Only the ones the build actually compiles are pulled, including
        # dex_builder, which a plain `--recursive` silently skips.
        run: |
          set -euo pipefail
          git submodule update --init \
            zygisk/external/LSPlant zygisk/external/Dobby zygisk/external/xz-embedded
          git -C zygisk/external/LSPlant submodule update --init \
            lsplant/src/main/jni/external/dex_builder
          git -C zygisk/external/LSPlant/lsplant/src/main/jni/external/dex_builder \
            submodule update --init external/parallel_hashmap
          test -f zygisk/external/LSPlant/lsplant/src/main/jni/external/dex_builder/CMakeLists.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Drop machine-local JDK path
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Install NDK and CMake
        # LSPlant needs CMake >= 3.28 (C++23 modules); Dobby's arm64 assembly needs NDK 29.
        run: |
          set -euo pipefail
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        # If secrets are missing in forks, generate a fallback keystore so release artifacts are signed and verification passes.
        env:
          KEYSTORE_B64: ${{ secrets.DUCKUSB_KEYSTORE_BASE64 }}
          LEGACY_KEYSTORE_B64: ${{ secrets.DUCKUSB_LEGACY_KEYSTORE_BASE64 }}
          DUCKUSB_STORE_PASSWORD: ${{ secrets.DUCKUSB_STORE_PASSWORD }}
          DUCKUSB_KEY_ALIAS: ${{ secrets.DUCKUSB_KEY_ALIAS }}
          DUCKUSB_KEY_PASSWORD: ${{ secrets.DUCKUSB_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/duckusb-release.jks"
            echo "DUCKUSB_STORE_FILE=$RUNNER_TEMP/duckusb-release.jks" >> "$GITHUB_ENV"
            echo "DUCKUSB_STORE_PASSWORD=${DUCKUSB_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "DUCKUSB_KEY_ALIAS=${DUCKUSB_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "DUCKUSB_KEY_PASSWORD=${DUCKUSB_KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "signing keystore decoded"
          else
            echo "No CI signing secrets found. Generating fallback keystore for fork build..."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/duckusb-release.jks" -alias duckusb -keyalg RSA -keysize 2048 -validity 10000 -storepass duckusb -keypass duckusb -dname "CN=DuckUSB, OU=DuckUSB, O=DuckUSB, L=Unknown, ST=Unknown, C=US"
            echo "DUCKUSB_STORE_FILE=$RUNNER_TEMP/duckusb-release.jks" >> "$GITHUB_ENV"
            echo "DUCKUSB_STORE_PASSWORD=duckusb" >> "$GITHUB_ENV"
            echo "DUCKUSB_KEY_ALIAS=duckusb" >> "$GITHUB_ENV"
            echo "DUCKUSB_KEY_PASSWORD=duckusb" >> "$GITHUB_ENV"
          fi
          if [ -n "$LEGACY_KEYSTORE_B64" ]; then
            echo "$LEGACY_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/duckusb-legacy.jks"
            echo "DUCKUSB_LEGACY_STORE_FILE=$RUNNER_TEMP/duckusb-legacy.jks" >> "$GITHUB_ENV"
            echo "legacy keystore decoded"
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :zygisk:app:assembleRelease \
            :zygisk:zygote:assembleRelease --no-daemon --stacktrace

      - name: Sign with the rotation lineage
        # The original 2026 key leaked with its password in git history. duckusb.lineage
        # rotates to the current key: Android 9+ reads the v3 block and the new key, Android 8
        # reads the v2 block, which apksigner still has to produce with the old key. Without
        # the lineage an installed build would refuse the update.
        if: env.DUCKUSB_STORE_FILE != '' && env.DUCKUSB_LEGACY_STORE_FILE != ''
        env:
          DUCKUSB_STORE_PASSWORD: ${{ secrets.DUCKUSB_STORE_PASSWORD }}
          DUCKUSB_KEY_ALIAS: ${{ secrets.DUCKUSB_KEY_ALIAS }}
          DUCKUSB_KEY_PASSWORD: ${{ secrets.DUCKUSB_KEY_PASSWORD }}
          DUCKUSB_LEGACY_STORE_PASSWORD: ${{ secrets.DUCKUSB_LEGACY_STORE_PASSWORD }}
          DUCKUSB_LEGACY_KEY_ALIAS: ${{ secrets.DUCKUSB_LEGACY_KEY_ALIAS }}
          DUCKUSB_LEGACY_KEY_PASSWORD: ${{ secrets.DUCKUSB_LEGACY_KEY_PASSWORD }}
        run: |
          chmod +x sign.sh
          ./sign.sh app/build/outputs/apk/release/app-release.apk \
                    zygisk/app/build/outputs/apk/release/app-release.apk

      - name: Verify the Xposed APK
        # These files ARE the module as far as the framework is concerned: lose one and the
        # APK still builds, still installs, and simply never loads. AGP can drop a META-INF
        # path without warning, so the packaged bytes are checked, not the source tree.
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          LIST=$(unzip -l "$APK")
          mkdir -p _check

          for f in module.prop java_init.list scope.list; do
            grep -q "META-INF/xposed/$f" <<< "$LIST" && echo "  ok: $f" \
              || { echo "  MISSING: META-INF/xposed/$f"; exit 1; }
          done

          # The native half is gone; if this comes back, per-app injection came back with it
          # and the module is detectable again.
          grep -q "META-INF/xposed/native_init.list" <<< "$LIST" \
            && { echo "  STALE: native_init.list is packaged but there is no native library"; exit 1; } \
            || echo "  ok: no native_init.list"
          grep -q "libduckusb.so" <<< "$LIST" \
            && { echo "  STALE: libduckusb.so is packaged"; exit 1; } \
            || echo "  ok: no bundled native library"
          grep -q "assets/xposed_init" <<< "$LIST" \
            && { echo "  STALE: legacy assets/xposed_init is packaged"; exit 1; } \
            || echo "  ok: no legacy entry point"

          unzip -p "$APK" META-INF/xposed/module.prop | tr -d '\r' > _check/module.prop
          grep -qE '^minApiVersion=101$' _check/module.prop && echo "  ok: minApiVersion=101" \
            || { echo "  module.prop does not declare minApiVersion=101"; cat _check/module.prop; exit 1; }

          # java_init.list must name a class the APK ships. The dex stores type descriptors
          # (Lcom/foo/Bar;), never the dotted name.
          ENTRY=$(unzip -p "$APK" META-INF/xposed/java_init.list | head -1 | tr -d '\r')
          DESC="L$(echo "$ENTRY" | tr '.' '/');"
          unzip -o -q "$APK" 'classes*.dex' -d _check
          grep -aqF "$DESC" _check/classes*.dex && echo "  ok: entry class $ENTRY present in dex" \
            || { echo "  MISSING: $ENTRY is not in any classes.dex"; exit 1; }

          echo "Xposed APK verified."

      - name: Verify the Zygisk module zip
        run: |
          set -euo pipefail
          ZIP=$(ls zygisk/zygote/build/outputs/magisk/release/*.zip)
          LIST=$(unzip -l "$ZIP")
          for f in module.prop classes.dex customize.sh service.sh post-fs-data.sh \
                   action.sh describe.sh zygisk/arm64-v8a.so zygisk/armeabi-v7a.so; do
            grep -q " $f\$" <<< "$LIST" && echo "  ok: $f" \
              || { echo "  MISSING: $f"; echo "$LIST"; exit 1; }
          done
          # action.sh is what puts the ACTION button on the root manager's module card.
          unzip -p "$ZIP" module.prop | grep -qE '^id=duckusb_zygisk$' \
            && echo "  ok: module id" || { echo "  bad module id"; exit 1; }
          echo "Zygisk zip verified: $ZIP"

      - name: Stage artifacts
        run: |
          set -euo pipefail
          XPOSED_VER=$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          ZYGISK_VER=$(grep -oE 'moduleVersionName by extra\("[^"]+"\)' build.gradle.kts | head -1 | cut -d'"' -f2 || echo "2.1.9")
          cp app/build/outputs/apk/release/app-release.apk ./DuckUSB-xposed.apk
          cp app/build/outputs/apk/release/app-release.apk "./DuckUSB-v${XPOSED_VER}-blacklist-zh.apk"
          cp zygisk/app/build/outputs/apk/release/app-release.apk ./DuckUSB-zygisk-manager.apk
          cp zygisk/app/build/outputs/apk/release/app-release.apk "./DuckUSB-Zygisk-Manager-v${ZYGISK_VER}-zh.apk"
          cp zygisk/zygote/build/outputs/magisk/release/*.zip ./
          ls -l ./*.apk ./*.zip

      - name: Build update.json
        # Only tags publish, so only tags need it. minApiVersion is read out of the built APK
        # rather than hardcoded, so the JSON cannot drift from what shipped.
        if: startsWith(github.ref, 'refs/tags/xposed-v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#xposed-v}"
          APK=DuckUSB-xposed.apk
          NAME="DuckUSB-${VERSION}.apk"
          MIN_API=$(unzip -p "$APK" META-INF/xposed/module.prop | sed -n 's/^minApiVersion=//p' | tr -d '\r')
          [ -n "$MIN_API" ] || { echo "module.prop declares no minApiVersion"; exit 1; }
          VERSION_CODE=$(grep -oE 'versionCode *= *[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          [ -n "$VERSION_CODE" ] || { echo "cannot read versionCode"; exit 1; }
          cat > update.json <<JSON
          {
            "schemaVersion": 1,
            "versionName": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "minApiVersion": ${MIN_API},
            "builtAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": { "sha": "${GITHUB_SHA}" },
            "apk": {
              "name": "${NAME}",
              "downloadUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}",
              "sizeBytes": $(stat -c%s "$APK"),
              "sha256": "$(sha256sum "$APK" | cut -d' ' -f1)"
            }
          }
          JSON
          python3 -c "import json;json.load(open('update.json'))" && cat update.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DuckUSB-release
          path: |
            *.apk
            *.zip
            update.json
          if-no-files-found: warn

  release-latest:
    # Automatically publishes or updates the single latest unified release on GitHub.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: DuckUSB-release

      - name: Publish or update Latest Release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="latest"

          echo "Cleaning up any standalone releases..."
          STANDALONE=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[] | select(.tagName != "latest") | .tagName' 2>/dev/null || true)
          for r in $STANDALONE; do
            echo "Deleting standalone release: $r"
            gh release delete "$r" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done

          ASSETS=()
          for f in *.apk *.zip; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          XPOSED_APK=$(ls DuckUSB-v*-blacklist-zh.apk 2>/dev/null | head -1 || echo "DuckUSB-xposed.apk")
          ZYGISK_APK=$(ls DuckUSB-Zygisk-Manager-v*-zh.apk 2>/dev/null | head -1 || echo "DuckUSB-zygisk-manager.apk")
          ZYGISK_ZIP=$(ls DuckUSB-Zygisk-*.zip 2>/dev/null | head -1 || echo "DuckUSB-Zygisk.zip")

          printf "%s\n" \
            "### DuckUSB 纯黑名单汉化版最新构建" \
            "" \
            "- **Xposed 模块 (推荐)**：\`$XPOSED_APK\`" \
            "- **Zygisk 管理器**：\`$ZYGISK_APK\`" \
            "- **Zygisk 模块刷机包**：\`$ZYGISK_ZIP\`" \
            "" \
            "#### 特性说明" \
            "- **纯黑名单模式**：默认放行所有应用，仅对勾选的目标应用隐藏 USB 调试与开发者选项。" \
            "- **正向逻辑开关**：主界面状态卡片优化为「启用」正向开关（开启=生效，关闭=暂停）。" \
            "- **免重启即时生效**：判定逻辑在 \`system_server\` 中执行，配置修改即刻生效，无需向目标 App 注入代码。" \
            "- **完整简体中文本地化**。" \
            > release_notes.md

          XPOSED_VER=$(echo "$XPOSED_APK" | sed -n 's/DuckUSB-v\([0-9.]*\)-blacklist-zh.apk/\1/p')
          ZYGISK_VER=$(echo "$ZYGISK_APK" | sed -n 's/DuckUSB-Zygisk-Manager-v\([0-9.]*\)-zh.apk/\1/p')
          RELEASE_TITLE="DuckUSB 纯黑名单汉化版 v${XPOSED_VER:-2.1.9} / v${ZYGISK_VER:-2.1.10} (Latest Release)"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Cleaning up outdated assets from $TAG release..."
            EXISTING_ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
            for old in $EXISTING_ASSETS; do
              MATCH=0
              for curr in "${ASSETS[@]}"; do
                [ "$old" = "$curr" ] && MATCH=1 && break
              done
              if [ "$MATCH" -eq 0 ]; then
                echo "Deleting old asset: $old"
                gh release delete-asset "$TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes || true
              fi
            done

            echo "Updating existing $TAG release..."
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating $TAG release..."
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md
          fi
